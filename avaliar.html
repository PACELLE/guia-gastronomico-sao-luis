<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Estabelecimento - Guia Gastronômico de São Luís</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Guia Gastronômico de São Luís</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="estabelecimentos.html">Estabelecimentos</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main>
        <form action="estabelecimentos.html">
            <h2>Avaliar Estabelecimento</h2>

            <p class="info-local">
                <strong>Local:</strong> Restaurante Exemplo
            </p>

            <p class="aviso-login">
                É necessário estar logado para avaliar. <a href="login.html">Fazer login</a>
            </p>

            <div>
                <label for="nota">Nota (1 a 5)</label>
                <select id="nota" required>
                    <option value="">Selecione uma nota</option>
                    <option value="5">5 - Excelente</option>
                    <option value="4">4 - Muito bom</option>
                    <option value="3">3 - Regular</option>
                    <option value="2">2 - Ruim</option>
                    <option value="1">1 - Péssimo</option>
                </select>
            </div>

            <div>
                <label for="comentario">Comentário</label>
                <textarea id="comentario" rows="4" placeholder="Conte como foi sua experiência..." required></textarea>
            </div>

            <button type="submit">Enviar Avaliação</button>

            <p class="form-rodape">
                <a href="estabelecimentos.html">Voltar para detalhes</a>
            </p>
        </form>
    </main>
</body>
</html>
