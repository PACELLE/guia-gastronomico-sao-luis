<!--
  Tela: Página Inicial (lista, busca e filtros)
  RFs atendidos: RF01, RF02, RF03
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Gastronômico de São Luís</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <header>
        <h1>Guia Gastronômico de São Luís</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Entrar</a>
            <a href="cadastro.html">Cadastrar</a>
        </nav>
    </header>

    <main id="conteudo">
        <section class="busca-filtros">
            <label for="busca" class="visualmente-oculto">Buscar estabelecimento por nome</label>
            <input type="text" id="busca" placeholder="Buscar estabelecimento por nome...">
            <div class="filtros">
                <button type="button">Todos</button>
                <button type="button">Comida Típica</button>
                <button type="button">Frutos do Mar</button>
            </div>
        </section>

        <!-- Mensagens de lista vazia, busca sem resultado ou erro (lidas por leitores de tela) -->
        <p id="mensagem" class="mensagem" role="status">Carregando...</p>

        <!-- Os cartões são criados por js/lista.js a partir da API (RF01) -->
        <section id="lista" class="lista-estabelecimentos" aria-label="Estabelecimentos"></section>
    </main>

    <script src="js/formatar.js"></script>
    <script src="js/lista.js"></script>
</body>
</html>
