<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Guia Gastronômico de São Luís</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Guia Gastronômico de São Luís</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="estabelecimentos.html">Estabelecimentos</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main>
        <form action="login.html">
            <h2>Criar Conta</h2>

            <div>
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome completo" required>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>
            </div>

            <div>
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita a senha" minlength="6" required>
            </div>

            <button type="submit">Cadastrar</button>

            <p class="form-rodape">
                Já tem conta? <a href="login.html">Entre aqui</a>
            </p>
        </form>
    </main>
</body>
</html>
