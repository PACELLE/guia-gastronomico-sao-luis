<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Guia Gastronômico de São Luís</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Guia Gastronômico de São Luís</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="estabelecimentos.html">Estabelecimentos</a>
            <a href="cadastro.html">Cadastre-se</a>
        </nav>
    </header>

    <main>
        <form>
            <h2>Entrar no Sistema</h2>
            
            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit">Entrar</button>
            
            <p style="text-align: center; font-size: 0.9rem; margin-top: 1rem;">
                Ainda não tem conta? <a href="cadastro.html" style="color: var(--cor-primaria);">Cadastre-se aqui</a>
            </p>
        </form>
    </main>
</body>
</html>
